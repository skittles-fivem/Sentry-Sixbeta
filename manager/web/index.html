<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sentry Six Manager</title>
  <link rel="icon" type="image/png" href="/web/icon.png">
  <link rel="stylesheet" href="/web/shell.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="side">
      <div class="side-card">
        <div class="brand">
          <svg class="i" aria-hidden="true"><use href="#i-shield"/></svg>
          <div class="brand-name"><b>Sentry Six</b><span>Manager</span></div>
        </div>
        <nav class="nav" id="nav" aria-label="Sections">
          <a href="#/overview" data-route="overview"><svg class="i"><use href="#i-overview"/></svg><span>Overview</span></a>
          <a href="#/footage" data-route="footage"><svg class="i"><use href="#i-folder"/></svg><span>Footage</span></a>
          <a href="#/viewer" data-route="viewer"><svg class="i"><use href="#i-play"/></svg><span>Viewer</span></a>
          <a href="#/encoder" data-route="encoder"><svg class="i"><use href="#i-cpu"/></svg><span>Encoder</span><b class="count" id="badge-encoder" hidden></b></a>
          <a href="#/policies" data-route="policies"><svg class="i"><use href="#i-shield"/></svg><span>Policies</span></a>
          <a href="#/jobs" data-route="jobs"><svg class="i"><use href="#i-jobs"/></svg><span>Jobs</span><b class="count" id="badge-jobs" hidden></b></a>
          <a href="#/bin" data-route="bin"><svg class="i"><use href="#i-trash"/></svg><span>Recycle Bin</span><b class="count" id="badge-bin" hidden></b></a>
          <a href="#/notifications" data-route="notifications"><svg class="i"><use href="#i-bell"/></svg><span>Notifications</span><b class="count alert" id="badge-notes" hidden></b></a>
          <a href="#/settings" data-route="settings"><svg class="i"><use href="#i-gear"/></svg><span>Settings</span></a>
        </nav>
        <button class="collapse" id="collapse" type="button"><svg class="i"><use href="#i-chevron"/></svg><span>Collapse</span></button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="topbar" id="topbar">
        <span class="crumb" id="crumb">Sentry Six Manager</span>
        <label class="check"><input type="checkbox" id="reduce-effects"> Reduce visual effects</label>
      </div>
      <div id="page"></div>
      <div id="frames"></div>
    </main>
  </div>

  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/web/app.js"></script>
</body>
</html>
