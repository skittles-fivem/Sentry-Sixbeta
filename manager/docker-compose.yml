# Sentry Manager: web UI on http://<docker-host>:9000
#
#   cd manager
#   docker compose up -d --build
#
# Sign in on first visit to create the account, then add vehicles (one SMB
# share each) under Settings. Optional defaults go in .env (see .env.example).
services:
  sentry-manager:
    build:
      context: ..
      dockerfile: manager/Dockerfile
    image: sentry-manager:latest
    container_name: sentry-manager
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Accounts, settings, job journals, thumbnails, converter staging and
      # the default output folder. Keep it on local disk, not on a share.
      - ./data:/data
    # Lets the container mount each vehicle's SMB share itself.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
      # - label=disable          # SELinux hosts (Fedora/RHEL)

    # ---- AMD (dGPU or APU) / Intel GPU: uncomment
    # devices:
    #   - /dev/dri:/dev/dri
    # The converter uses /dev/dri/renderD128. With several GPUs, map the one
    # you want to that name instead, e.g. - /dev/dri/renderD129:/dev/dri/renderD128

    # ---- NVIDIA GPU (needs the NVIDIA Container Toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
