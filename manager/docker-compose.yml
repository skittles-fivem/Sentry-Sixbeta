# Sentry Manager: web UI on https://<docker-host>:9000
#
#   cd manager
#   docker compose up -d --build
#   docker logs sentry-manager     # the setup code and the HTTPS fingerprint
#
# Create the account with the setup code from the log, then add vehicles (one
# SMB share each) under Settings. Optional defaults go in .env (.env.example).
services:
  sentry-manager:
    build:
      context: ..
      dockerfile: manager/Dockerfile
    image: sentry-manager:latest
    container_name: sentry-manager
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Accounts, settings, job journals, thumbnails, converter staging and
      # the default output folder. Keep it on local disk, not on a share.
      - ./data:/data
    # Only the small root supervisor keeps these; the web app, ffmpeg and
    # updates run as PUID:PGID with no capabilities at all.
    #   SYS_ADMIN, DAC_READ_SEARCH, DAC_OVERRIDE  mount.cifs (SMB shares)
    #   SETUID, SETGID, SETPCAP                   start the app unprivileged
    #   CHOWN, KILL                               own /data, stop the app
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
      - KILL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined      # Docker's default AppArmor profile forbids mount
      # - label=disable          # SELinux hosts (Fedora/RHEL)

    # ---- AMD (dGPU or APU) / Intel GPU: uncomment
    # devices:
    #   - /dev/dri:/dev/dri
    # The converter uses /dev/dri/renderD128. With several GPUs, map the one
    # you want to that name instead, e.g. - /dev/dri/renderD129:/dev/dri/renderD128

    # ---- NVIDIA GPU (needs the NVIDIA Container Toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
